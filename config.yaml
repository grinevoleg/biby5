# Конфигурация торговой системы.
# Все проценты указаны в процентах (1.0 = 1%), комиссии — в долях (0.0002 = 0.02%).

exchange:
  demo: true            # true = демо-счёт Bybit (api-demo.bybit.com), false = реальный счёт
  recv_window: 5000

# Инструменты: ликвидные USDT-перпетуалы с достаточной внутридневной волатильностью
# и маленьким минимальным лотом — подходят для депозита $100-500.
symbols:
  - SOLUSDT
  - XRPUSDT
  - DOGEUSDT

interval: "5"           # таймфрейм свечей в минутах (строка, формат Bybit: 1, 3, 5, 15, ...)

strategy:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30.0
  rsi_overbought: 70.0
  atr_period: 14
  sl_atr_mult: 1.5      # стоп = вход -/+ 1.5 * ATR
  entry_offset_atr: 0.0 # лимитный вход на N*ATR глубже экстремума (0 = по закрытию).
                        # Ловит панические выносы по лучшей цене, но входов меньше.
  trend_ema_period: 200
  trend_filter: true    # лонги только если SMA20 выше EMA200, шорты — наоборот
  min_profit_pct: 0.25  # минимальное расстояние до тейка, иначе сделка не открывается
  min_rr: 0.5           # минимум (тейк-вход)/(вход-стоп)
  time_stop_bars: 24    # принудительный выход через N баров (24 * 5м = 2 часа)

risk:
  equity_cap_usdt: 300.0      # размер позиций считается от min(реальный баланс, этот лимит).
                              # На демо баланс огромный — лимит делает сайзинг как на реальном депозите.
  risk_per_trade_pct: 1.0     # риск на сделку (расстояние до стопа) в % от рабочего капитала
  max_notional_pct: 30.0      # максимум номинала одной позиции в % от рабочего капитала
  max_positions: 2            # одновременных позиций суммарно
  daily_loss_limit_pct: 3.0   # дневной лимит убытка: достигнут — новые входы до конца дня (UTC) запрещены
  max_trades_per_day: 15
  leverage: 2                 # плечо на инструменте (сайзинг от риска, плечо лишь даёт запас маржи)

execution:
  poll_interval_sec: 5
  entry_timeout_sec: 600      # не исполнился лимитник за это время — отменяем, не гонимся за ценой
                              # (2 бара на 5м — как entry_timeout_bars=2 в бэктесте)
  order_qty_min_notional: 5.0 # минимальный номинал ордера на Bybit linear
  heartbeat_sec: 300          # каждые N секунд печатать строку состояния по инструментам

fees:
  maker: 0.0002
  taker: 0.00055

journal_db: journal.db
log_file: logs/bot.log
